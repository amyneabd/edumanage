services:
  - type: web
    name: edumanage
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace server && npm run build && npm run prisma:migrate:deploy --workspace server
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Temporary: Resend has no verified sending domain yet, so delivery is
      # restricted to the Resend account owner's own email. Disables the
      # email-verification gate until a domain is verified — see
      # server/.env.example for details. Not a secret, so committed directly.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
